[package]
name = "pflow-native"
description = "Native Petri-net editor and simulator on pflow-rs (egui/eframe)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pflow-native"
path = "src/main.rs"

[dependencies]
pflow-native-core.workspace = true
serde_json.workspace = true
eframe = { version = "0.37", features = ["persistence"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pflow-native-core = { workspace = true, features = ["http", "png"] }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }

[features]
default = ["services"]
# pflow.xyz, sim.pflow.xyz and GitHub (Remote and Share menus, Accounts).
# Build with --no-default-features for an app that never contacts them.
services = ["pflow-native-core/services"]
# Groth16 firing proofs (zk.*), native only. Opt-in: the upstream circuit
# does not yet prove enabledness (FEATURES.md §D 9).
zk = ["pflow-native-core/zk"]
# Experimental RNN policies (rnn.*, the Learn menu). Opt-in: `make build-rnn`.
rnn = ["pflow-native-core/rnn"]
