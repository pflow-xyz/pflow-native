[package]
name = "pflow-native-core"
description = "Headless document model, command registry and simulation for pflow-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pflow-core.workspace = true
pflow-parser.workspace = true
pflow-metamodel.workspace = true
pflow-solver.workspace = true
pflow-verify.workspace = true
pflow-validation.workspace = true
pflow-eventlog.workspace = true
pflow-mining.workspace = true
pflow-learn.workspace = true
pflow-compose.workspace = true
serde.workspace = true
# float_roundtrip: parse floats exactly, as Go does, so CIDs of documents
# with fractional numbers match pflow.xyz.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror.workspace = true
ureq = { version = "3", optional = true }
# Provenance: signed run receipts (provenance.rs).
ed25519-dalek = "2"
base64 = "0.23"
getrandom = "0.2"
web-time = "1"
# Zero-knowledge proofs of firings (zk.rs), feature `zk`.
pflow-zk = { workspace = true, optional = true }
pflow-zk-arkworks = { workspace = true, optional = true }
# Elman RNN policies (commands/rnn.rs), feature `rnn`.
pflow-tropical = { workspace = true, optional = true }
ark-bn254 = { version = "0.5", optional = true }
ark-groth16 = { version = "0.5", optional = true }
ark-relations = { version = "0.5", optional = true }
ark-serialize = { version = "0.5", optional = true }
ark-snark = { version = "0.5", optional = true }
ark-std = { version = "0.5", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[features]
default = []
# Network loading (file.open_url / file.open_cid). Native builds turn it on;
# the wasm build leaves it off.
http = ["dep:ureq"]
# Everything that talks to the author's web services: pflow.xyz (save, list,
# share, Gist, open by CID, permalinks), sim.pflow.xyz (MCP bridge) and the
# sign-ins (auth.*). The app and CLI turn it on by default; build them with
# --no-default-features (`make build-offline`) for an app that never
# contacts those services. Fetching a URL the user gives (file.open_url)
# only needs `http`.
services = []
# Groth16 proofs of firings (zk.*). Opt-in (the CLI's and app's `zk` features
# forward here): the upstream circuit does not yet prove enabledness
# (FEATURES.md §D 9). Without it the zk.* commands exist but refuse.
zk = [
    "dep:pflow-zk",
    "dep:pflow-zk-arkworks",
    "dep:ark-bn254",
    "dep:ark-groth16",
    "dep:ark-relations",
    "dep:ark-serialize",
    "dep:ark-snark",
    "dep:ark-std",
]
# Experimental: Elman RNN policies (rnn.*), from pflow-tropical. Opt-in (the
# CLI's and app's `rnn` features forward here): a learned policy is a guess,
# not a verdict, and pflow-tropical is research code. Without it the rnn.*
# commands do not exist.
rnn = ["dep:pflow-tropical"]
