[package]
name = "pflow-native-core"
description = "Headless document model, command registry and simulation for pflow-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pflow-core.workspace = true
pflow-parser.workspace = true
pflow-metamodel.workspace = true
pflow-solver.workspace = true
pflow-reachability.workspace = true
pflow-verify.workspace = true
pflow-validation.workspace = true
pflow-results.workspace = true
pflow-eventlog.workspace = true
pflow-mining.workspace = true
pflow-learn.workspace = true
serde.workspace = true
# float_roundtrip: parse floats exactly, as Go does, so CIDs of documents
# with fractional numbers match pflow.xyz.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror.workspace = true
ureq = { version = "3", optional = true }

[features]
default = []
# Network loading (file.open_url / file.open_cid). Native builds turn it on;
# the wasm build leaves it off.
http = ["dep:ureq"]
