[workspace]
resolver = "2"
members = ["crates/core", "crates/app", "crates/cli", "crates/wasm"]
default-members = ["crates/core", "crates/app", "crates/cli", "crates/wasm"]

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/pflow-xyz/pflow-native"
homepage = "https://pflow.xyz"

[workspace.dependencies]
# pflow-rs, pinned. To build against a sibling checkout instead, see
# .cargo/config.toml.example.
pflow-core = { git = "https://github.com/pflow-xyz/pflow-rs", rev = "a1c4b55aed9d1978f588b68ea5a82a985191bddf" }
pflow-parser = { git = "https://github.com/pflow-xyz/pflow-rs", rev = "a1c4b55aed9d1978f588b68ea5a82a985191bddf" }
pflow-metamodel = { git = "https://github.com/pflow-xyz/pflow-rs", rev = "a1c4b55aed9d1978f588b68ea5a82a985191bddf" }
pflow-solver = { git = "https://github.com/pflow-xyz/pflow-rs", rev = "a1c4b55aed9d1978f588b68ea5a82a985191bddf" }
pflow-verify = { git = "https://github.com/pflow-xyz/pflow-rs", rev = "a1c4b55aed9d1978f588b68ea5a82a985191bddf" }
pflow-validation = { git = "https://github.com/pflow-xyz/pflow-rs", rev = "a1c4b55aed9d1978f588b68ea5a82a985191bddf" }
pflow-eventlog = { git = "https://github.com/pflow-xyz/pflow-rs", rev = "a1c4b55aed9d1978f588b68ea5a82a985191bddf" }
pflow-mining = { git = "https://github.com/pflow-xyz/pflow-rs", rev = "a1c4b55aed9d1978f588b68ea5a82a985191bddf" }
pflow-learn = { git = "https://github.com/pflow-xyz/pflow-rs", rev = "a1c4b55aed9d1978f588b68ea5a82a985191bddf" }
pflow-compose = { git = "https://github.com/pflow-xyz/pflow-rs", rev = "a1c4b55aed9d1978f588b68ea5a82a985191bddf" }
# Zero-knowledge proofs of firings (feature `zk` on pflow-native-core).
pflow-zk = { git = "https://github.com/pflow-xyz/pflow-rs", rev = "a1c4b55aed9d1978f588b68ea5a82a985191bddf" }
pflow-zk-arkworks = { git = "https://github.com/pflow-xyz/pflow-rs", rev = "a1c4b55aed9d1978f588b68ea5a82a985191bddf" }
# Experimental RNN policies (feature `rnn` on pflow-native-core). Without its
# default `pflow` feature it has no dependencies.
pflow-tropical = { git = "https://github.com/pflow-xyz/pflow-rs", rev = "a1c4b55aed9d1978f588b68ea5a82a985191bddf", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
pflow-native-core = { path = "crates/core" }

[profile.dev.package."*"]
opt-level = 2

# The browser registry (`make wasm-shim`): size over speed, as pflow.xyz
# downloads it. Native builds keep the release profile.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
