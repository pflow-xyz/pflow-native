[workspace]
resolver = "2"
members = ["crates/core", "crates/app", "crates/cli"]
default-members = ["crates/core", "crates/app", "crates/cli"]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/pflow-xyz/pflow-native"
homepage = "https://pflow.xyz"

[workspace.dependencies]
# pflow-rs, pinned. To build against a sibling checkout instead, see
# .cargo/config.toml.example.
pflow-core = { git = "https://github.com/pflow-xyz/pflow-rs", rev = "fcb38acd69f6325414e32ffc58416befa6e93e64" }
pflow-parser = { git = "https://github.com/pflow-xyz/pflow-rs", rev = "fcb38acd69f6325414e32ffc58416befa6e93e64" }
pflow-metamodel = { git = "https://github.com/pflow-xyz/pflow-rs", rev = "fcb38acd69f6325414e32ffc58416befa6e93e64" }
pflow-solver = { git = "https://github.com/pflow-xyz/pflow-rs", rev = "fcb38acd69f6325414e32ffc58416befa6e93e64" }
pflow-verify = { git = "https://github.com/pflow-xyz/pflow-rs", rev = "fcb38acd69f6325414e32ffc58416befa6e93e64" }
pflow-validation = { git = "https://github.com/pflow-xyz/pflow-rs", rev = "fcb38acd69f6325414e32ffc58416befa6e93e64" }
pflow-eventlog = { git = "https://github.com/pflow-xyz/pflow-rs", rev = "fcb38acd69f6325414e32ffc58416befa6e93e64" }
pflow-mining = { git = "https://github.com/pflow-xyz/pflow-rs", rev = "fcb38acd69f6325414e32ffc58416befa6e93e64" }
pflow-learn = { git = "https://github.com/pflow-xyz/pflow-rs", rev = "fcb38acd69f6325414e32ffc58416befa6e93e64" }
pflow-compose = { git = "https://github.com/pflow-xyz/pflow-rs", rev = "fcb38acd69f6325414e32ffc58416befa6e93e64" }
# Zero-knowledge proofs of firings (feature `zk` on pflow-native-core).
pflow-zk = { git = "https://github.com/pflow-xyz/pflow-rs", rev = "fcb38acd69f6325414e32ffc58416befa6e93e64" }
pflow-zk-arkworks = { git = "https://github.com/pflow-xyz/pflow-rs", rev = "fcb38acd69f6325414e32ffc58416befa6e93e64" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
pflow-native-core = { path = "crates/core" }

[profile.dev.package."*"]
opt-level = 2
